name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Test Suite"]
    types:
      - completed
    branches: [main]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Only deploy if tests pass
  check-tests:
    name: Check Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'

    outputs:
      deploy: ${{ steps.check.outputs.deploy }}

    steps:
      - name: Check if tests passed
        id: check
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  # Build and push Docker image
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check-tests
    if: needs.check-tests.outputs.deploy == 'true'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1

      - name: Output image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [check-tests, build-image]
    if: needs.check-tests.outputs.deploy == 'true'

    environment:
      name: staging
      url: https://staging.financeapp.com

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ needs.build-image.outputs.image }} to staging"
          # Replace with actual deployment commands
          # Examples:
          # - kubectl apply -f k8s/staging/
          # - helm upgrade --install staging ./helm-chart
          # - aws ecs update-service --cluster staging --service finance-app
          # - docker run -d --name staging ${{ needs.build-image.outputs.image }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging"
          # Add smoke test commands here
          # curl -f https://staging.financeapp.com/health || exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Staging deployment completed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Deploy to production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, build-image]
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://financeapp.com

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying ${{ needs.build-image.outputs.image }} to production"
          # Replace with actual production deployment commands

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests"
          # Add production smoke test commands

      - name: Update deployment status
        run: |
          echo "Production deployment completed successfully"

      - name: Notify production deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'Production deployment completed successfully! 🎉'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Database migrations (if needed)
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: check-tests
    if: needs.check-tests.outputs.deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run database migrations
        run: |
          echo "Running database migrations"
          # Add migration commands here
          # npm run migrate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI_PRODUCTION }}

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Performance monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup monitoring
        run: |
          echo "Setting up performance monitoring"
          # Add monitoring setup commands
          # - Configure New Relic, DataDog, etc.
          # - Set up alerts and dashboards

      - name: Validate performance metrics
        run: |
          echo "Validating performance metrics"
          # Add performance validation
          # - Check response times
          # - Verify error rates
          # - Monitor resource usage

  # Cleanup old deployments
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Clean up old images
        run: |
          echo "Cleaning up old Docker images"
          # Add cleanup commands
          # docker image prune -f
          # kubectl delete pods --field-selector=status.phase=Succeeded

      - name: Clean up old artifacts
        uses: actions/delete-package-versions@v4
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

  # Rollback capability
  setup-rollback:
    name: Setup Rollback
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Tag successful deployment
        run: |
          echo "Tagging successful deployment for potential rollback"
          # Add rollback preparation commands
          # git tag production-$(date +%Y%m%d-%H%M%S)
          # kubectl label deployment finance-app version=stable

      - name: Store rollback information
        run: |
          echo "Storing rollback information"
          # Store deployment metadata for rollback
          echo "${{ needs.build-image.outputs.image }}" > last-successful-deployment.txt

      - name: Upload rollback info
        uses: actions/upload-artifact@v4
        with:
          name: rollback-info
          path: last-successful-deployment.txt
          retention-days: 30